name: MLB Machine Learning Pipeline

on:
  schedule:
    # Runs at 09:00 AM UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caching dependencies to speed up subsequent runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute MLB Prediction Pipeline
        env:
          # Passing GitHub Secrets as Environment Variables to the Python script
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/main.py

      - name: Commit and Push updates
        run: |
          # Configure Git with a bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all changes (data, models, etc.)
          git add .
          
          # Check if there are any changes to commit to avoid workflow failure
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Automated update: MLB data and models [skip ci]"
            git push
          fi
